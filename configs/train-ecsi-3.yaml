model:
  _yaml_: "model/kfold-ecsi.yaml"
  sequence_encoder:
    path: /mnt/parallel_storage/share/plm_weights/esm-multimodal/esm-multimodal-v1.pt
  structure_encoder:
    path: /mnt/parallel_storage/share/plm_weights/unitok/unitok-dips.pt
  trunk:
    channel_seq_emb: 1152
    channel_seq_attn: 648
    channel_struct_emb: 1536
    plm_module:
      use_qk_norm: true
      blocks_per_ckpt: 4
    pairformer:
      use_qk_norm: true
      blocks_per_ckpt: 8
    num_register_tokens: 8
  score_model:
    blocks_per_ckpt: 24

train:
  _yaml_: "train/stage_3.yaml"
  name: ecsi
  out_dir: ./experiments/

  global_hparams:
    batch_size: 1
    global_batch_size: 256

  loss:
    weights:
      smooth_lddt: 1.0
    diffusion_loss:
      smooth_lddt_loss:
        chunk_size: 1

  data:
    max_tokens: 760
    ccd_path: /cache/wykim_lab/kfold_data/v260310/ccd-train.pkl
    train_datasets:
      - _yaml_: "dataset/rcsb-train-ft.yaml"
        weight: 0.600
        data_path: /cache/wykim_lab/kfold_data/v260310/dataset/rcsb-train/

      - _yaml_: "dataset/afdb-long-ft.yaml"
        weight: 0.395
        data_path: /cache/wykim_lab/kfold_data/v260310/dataset/afdb-long/

      - _yaml_: "dataset/afdb-short.yaml"
        weight: 0.005
        data_path: /cache/wykim_lab/kfold_data/v260310/dataset/afdb-short/

    val_datasets:
      - _yaml_: "dataset/rcsb-val.yaml"
        data_path: /cache/wykim_lab/kfold_data/v260310/dataset/rcsb-val/

  wandb:
    use: false
    project: "KFold"
    group: ecsi # set your group name
    entity: K-Fold # set your entity name
