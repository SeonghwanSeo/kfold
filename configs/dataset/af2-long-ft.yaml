_yaml_: "default-train.yaml"

name: af2-long
type: "monomer-distillation"
prob_drop_apo: 1.0
prob_drop_struct_token: 1.0

sampler: null

cropper:
  _registry_: "data_cropper"
  _class_: AlphaFold3Cropper
  w_contiguous: 0.25
  w_spatial: 0.75
  w_spatial_interface: 0.0

apo_init:
  # Use harsh perturbation for AFDB to improve robustness.
  prob_perturbation: 1.0
  perturbation:
    bioprior:
      min_steps: 5
      max_steps: 20
