_yaml_: "default-train.yaml"

name: afdb-long
is_distillation: true

sampler: null

cropper:
  _registry_: "data_cropper"
  _class_: AlphaFold3Cropper
  w_contiguous: 0.25
  w_spatial: 0.75
  w_spatial_interface: 0.0

apo_init:
  prob_perturbation: 1.0
  # Use harsh perturbation for AFDB to improve robustness.
  protein_perturbation:
    bioprior:
      min_steps: 5
      max_steps: 20
  # no ligand
  ligand_perturbation: null
