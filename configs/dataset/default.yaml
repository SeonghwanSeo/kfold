# RCSB training dataset configuration.
name: ???

# Data paths
data_path: <DATA_PATH_PLACEHOLDER>
manifest_path: null # optionally provide a custom manifest path
seed: null # should be null for data augmentation

apo_init:
  use_perturbation: false
  use_random_augmentation: true
  use_residue_permutation: false
  is_protein_monomer_distillation: false
  prob_perturbation: 0.95
  use_cached_conformer: true
  protein_perturbation: null
  small_mol_perturbation: null

prior_sampler:
  num_samples: 1
  use_random_augmentation: true
  use_chain_com_sampling: false
  use_ot_permutation: false
  translation_scale: 1.0 # Angstroms
  # missing atom filling settings
  relaxation:
    num_steps: 64
