# RCSB training dataset configuration.
name: ???

# Data paths
data_path: <DATA_PATH_PLACEHOLDER>
manifest_path: null # optionally provide a custom manifest path
seed: null # should be null for data augmentation

apo_init:
  use_perturbation: false
  use_random_augmentation: true
  use_ot_permutation: false
  translation_scale: 10.0 # Angstroms
  prob_perturbation: 1.0
  prob_replace_to_holo: 0.0 # enabled during training
  training: true # If True, skip etkdg generation if there is no cached etkdg conformer. (use ideal/model conformer)
  fill_missing_atom: false # Whether to fill missing atoms in apo structure using neighbors

  prior_sampler:
    # polymer prior sampler if apo structure is unavailable
    type: "globular" # 'null', 'zero', 'normal', 'globular'
    # Langevin dynamics settings for globular prior
    num_steps: 64
    dt: 0.25
    bond_r: 4.0
    res_r: 4.0
    ent_r: 10.0
    sphere_r: 10.0 # This value is also used for normal prior sampling.

  apo_perturbation:
    # Apo structure perturbation settings (if use_perturbation is true)
    prob_rieprody: 1.0 # Probability of using RieProDy perturbation
    langevin:
      # Langevin dynamics settings (fallback if RiePrody is not used or fails)
      min_steps: 1
      max_steps: 3
      dt: 0.25
      res_r: 4.0
      bond_r: 4.0
      ent_r: 10.0
      sphere_r: 10.0
    rieprody:
      # RieProDy Riemannian perturbation settings
      metric_lmdb_path: null # NOTE: This is automatically set in the dataset.
      rmsd_threshold: 10.0 # RMSD threshold for fallback
      fallback_on_failure: false # Fallback to return the original structure if RieProDy perturbation fails
      fallback_on_rmsd_exceed: true # Fallback to return the original structure if RMSD exceeds threshold
      metric_comp:
        apo_internal_coord_metric_calculation_precision: "float64"
        apo_internal_coord_metric_save_precision: "float16"
      random_walk:
        # Riemannian random walk settings
        apo_internal_coord_random_walk_precision: "float32"
        consider_side_chain_in_metric: false
        num_steps: 1 # Number of random walk steps per perturbation
        total_time: 15.0 # Maximum total simulation time (sampled uniformly in [total_time_min, total_time) per call)
        total_time_min: 0.0 # Minimum total simulation time for uniform sampling
        metric_calculation_period: 100
        metric: "lagrangian"
        use_precomputed_metric: true # Use pre-computed metric from LMDB
        with_christoffel_term: false
        kabsch_aligned_traj: false
      log_stats: false # Whether to log perturbation statistics periodically
      log_stats_interval: 1000 # Log statistics every N chain perturbations
