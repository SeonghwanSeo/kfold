# RCSB training dataset configuration for final stage confidence head training
_yaml_: "default-train.yaml"

name: rcsb-train
is_distillation: false

filters:
  - _registry_: "data_filter"
    _class_: ResolutionFilter
    min: 0.1
    max: 4.0

sampler:
  _registry_: "data_sampler"
  _class_: ClusterSampler
  beta_chain: 0.5
  beta_interface: 1.0
  allow_redundant: False

cropper:
  _registry_: "data_cropper"
  _class_: AlphaFold3Cropper
  w_contiguous: 0.2
  w_spatial: 0.4
  w_spatial_interface: 0.4

apo_init:
  prob_perturbation: 0.0
  protein_perturbation: null
  ligand_perturbation: null
