# AFDB (<200 residues) training dataset configuration.
_yaml_: "default-train.yaml"

name: afdb-short
weight: 0.05

# Data paths
data_path: <DATA_PATH_PLACEHOLDER>
seed: null # should be null for data augmentation
is_protein_monomer_distillation: true

sampler:
  _registry_: "data_sampler"
  _class_: UniformSampler
  level: "complex"

# No cropping for short proteins.
cropper:
  _registry_: "data_cropper"
  _class_: MultiAnchorCropper
  max_anchors: 1
  w_contiguous: 1.0
  w_spatial: 0.0
  w_spatial_interface: 0.0

apo_init:
  prob_perturbation: 1.0
  # Use harsher perturbation than longer one.
  protein_perturbation:
    bioprior:
      min_steps: 10
      max_steps: 30
  # no ligand
  ligand_perturbation: null
