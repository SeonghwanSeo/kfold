_yaml_: "default-train.yaml"

name: af-m-homodimer
type: "homodimer-distillation"
prob_drop_apo: 0.1
prob_drop_struct_token: 1.0

sampler: null

cropper:
  _registry_: "data_cropper"
  _class_: AlphaFold3Cropper
  w_contiguous: 0.0
  w_spatial: 0.0
  w_spatial_interface: 1.0

apo_init:
  # Use harsh perturbation for AFDB to improve robustness.
  prob_perturbation: 1.0
  perturbation:
    bioprior:
      max_steps: 20
