model:
  _yaml_: "model/boltz1.yaml"

train:
  _yaml_: "train/structure_only.yaml"

  name: debug-512
  out_dir: ./experiments/
  seed: 42

  # pytorch lightning trainer hparams
  trainer:
    strategy: "auto"
    devices: 8
    num_nodes: 1
    precision: 32
    max_epochs: 100
    limit_train_batches: 1000
    accumulate_grad_batches: 32 # 256 // batch_size // num_gpus

  training:
    diffusion_batch_size: 16

    train_trunk: false
    train_distogram_head: false
    train_structure_module: true
    train_confidence_head: false

  data:
    train_batch_size: 1
    max_tokens: 512
    lmdb_path: /cache/wykim_lab/kfold_data/kfold_rcsb_processed_v251120.lmdb/
    manifest_path: /cache/wykim_lab/kfold_data/manifests/af3_manifest.pkl
    split_path: ./assets/splits/boltz1
    num_workers: 8 # set to batch_size * 4.

    featurization_args:
      synchronize_ref_pos_augmentation: true

  wandb:
    use: false
    project: "KFold-edm"
    group: structure-only # set your group name
    entity: K-Fold # set your entity name
