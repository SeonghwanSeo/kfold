model:
  _yaml_: "model/boltz1-full.yaml"
  load_weight: true
  kernel:
    cuequivariance: true

train:
  _yaml_: "train/structure_only.yaml"

  name: boltz1
  out_dir: ./experiments/
  seed: 42

  # pytorch lightning trainer hparams
  trainer:
    strategy: "auto"
    devices: "auto"
    num_nodes: 1
    precision: 32

  data:
    ccd_path: /cache/wykim_lab/kfold_data/ccd-val.pkl
    lmdb_path: /cache/wykim_lab/kfold_data/kfold_rcsb_processed_v251120.lmdb/
    manifest_path: /cache/wykim_lab/kfold_data/manifests/af3_manifest.pkl
    split_path: ./assets/splits/boltz1
    num_workers: 8

    featurization_args:
      # NOTE: Set True to use pre-trained Boltz1
      synchronize_ref_pos_augmentation: true
