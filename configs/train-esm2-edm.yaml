model:
  _yaml_: "model/kfold-edm.yaml"
  input_embedder:
    channel_seq_encoder: 2560

train:
  _yaml_: "train/structure_only.yaml"

  name: esm2-rbf-edm
  out_dir: ./experiments/
  seed: 42

  global_hparams:
    max_chains: 20
    max_tokens: 384
    batch_size: 4
    diffusion_batch_size: 48
    global_batch_size: 128
    num_global_steps_per_epoch: 1000

  # pytorch lightning trainer hparams
  trainer:
    strategy: "auto"
    devices: "auto"
    num_nodes: 1
    precision: bf16-mixed

  data:
    ccd_path: /cache/wykim_lab/kfold_data/v260103/ccd-train.pkl
    train_datasets:
      - _yaml_: "dataset/rcsb-train.yaml"
        data_path: /cache/wykim_lab/kfold_data/v260103/dataset/rcsb-train/
    val_datasets:
      - _yaml_: "dataset/rcsb-val.yaml"
        data_path: /cache/wykim_lab/kfold_data/v260103/dataset/rcsb-val/
    pretrained_embedding:
      seq: esm2-3b
      seq_dim: 2560

  wandb:
    use: false
    project: "KFold-Combined"
    group: esm # set your group name
    entity: K-Fold # set your entity name
