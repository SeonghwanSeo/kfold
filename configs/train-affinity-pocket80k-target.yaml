train:
  name: "affinity-pocket80k-target"
  out_dir: "outputs/affinity"
  seed: 20260822
  runtime:
    multiprocessing_sharing_strategy: "file_system"
    float32_matmul_precision: "high"
  lineage:
    snapshot_digest: null
  data:
    manifest_path: ???
    cache_root: ???
    cache_schema: "affinity_pocket80k_target_consensus_100_v2"
    cache_encoding: "affinity_arraypack_raw_v1"
    mode: "boltz2_continuous_affinity"
    version: "pocket80k_target_continuous_v1"
    sampling_mode: "boltz2_activity_cliff"
    crop_mode: "pocket80k_target_compact"
    pocket_manifest_path: null
    pocket_neighborhood_size: 10
    crop_contract_version: "target_consensus_100_v1"
    distogram_pocket_distance_cutoff: 15.0
    distogram_use_entropy_tiebreak: true
    distogram_entropy_gate: 0.7
    distogram_strong_binder_p_activity: 6.0
    max_crop_tokens: 256
    max_protein_crop_tokens: 200
    train_batches_per_epoch: 1000
    num_workers: 2
    pin_memory: true
    train_batch_size: 64
    val_batch_size: 32
    shape_buckets: [256]
    activity_group_size: 5
    activity_groups_per_batch: 12
    singleton_regression_slots: 4
    labels_per_source: 16
    rankable_assays_per_batch: 4
    records_per_rankable_assay: 4
  model:
    channel_s: 384
    channel_z: 256
    num_distogram_features: 3
    num_heads_attn: 16
    num_blocks: 6
    dropout: 0.1
    blocks_per_ckpt: 1
    cross_pair_only: true
    use_kernels: false
  task:
    mode: "boltz2_continuous"
    version: "boltz2_continuous_affinity_v2"
    learning_rate: 0.0001
    weight_decay: 0.001
    huber_delta: 0.5
    difference_weight: 0.9
    absolute_weight: 0.1
    ranking_weight: 0.5
    pairwise_temperature: 0.2
    near_tie_delta: 0.1
  trainer:
    accelerator: "gpu"
    strategy: "ddp"
    devices: 8
    num_nodes: 1
    precision: "bf16-mixed"
    max_epochs: -1
    max_steps: 10000
    limit_val_batches: null
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    num_sanity_val_steps: 0
    use_distributed_sampler: false
  compile:
    enabled: true
    mode: "reduce-overhead"
    dynamic: false
  wandb:
    use: true
    project: "v260823-affinity"
    entity: "K-Fold"
    group: "pocket80k-target-consensus100"
    tags: ["80k-only", "distogram", "target-medoid-pocket", "b64", "compiled"]
    log_model: false
  checkpoint:
    enabled: true
    monitor: "val/mean_assay_pearson"
    monitor_mode: "max"
    save_top_k: 3
    milestones: [400, 1000, 2000, 5000, 10000]
    every_n_epochs: 1
  performance_smoke:
    enabled: false
    loader_batches: 200
    warmup_steps: 8
    measured_steps: 100
    max_p50_seconds: 2.0
    max_p95_seconds: 3.0
    max_data_wait_fraction: 0.2
