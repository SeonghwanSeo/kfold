model:
  _yaml_: "model/kfold-ecsi.yaml"
  protein_sequence_encoder:
    path: /mnt/parallel_storage/share/kfold_weights/pretrained/prot_seq_3b-upd.pth
  rna_sequence_encoder:
    path: /mnt/parallel_storage/share/kfold_weights/pretrained/rna_seq_300m.pth
  protein_structure_encoder:
    path: /mnt/parallel_storage/share/kfold_weights/pretrained/prot_struct_3b.pth
  score_model:
    blocks_per_ckpt: 4
    ckpt_atom_stack: true
  confidence_head:
    blocks_per_ckpt: 2

train:
  _yaml_: "train/stage_3.yaml"
  name: ecsi

  loss:
    diffusion_loss:
      smooth_lddt_loss:
        chunk_size: 1
