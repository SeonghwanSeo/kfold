model:
  _yaml_: "model/kfold-ecsi.yaml"
  sequence_encoder:
    path: /mnt/parallel_storage/share/plm_weights/esm-multimodal/esm-multimodal-v1.pt
  structure_encoder:
    path: /mnt/parallel_storage/share/plm_weights/unitok/unitok-dips.pt
  trunk:
    channel_seq_emb: 1152
    channel_seq_attn: 648
    channel_struct_emb: 1536
    plm_module:
      blocks_per_ckpt: null
    pairformer:
      num_blocks: 16
      blocks_per_ckpt: 4
  score_model:
    atom_encoder_blocks: 1
    token_transformer_blocks: 8
    atom_decoder_blocks: 1
    blocks_per_ckpt: null

train:
  _yaml_: "train/stage_1.yaml"
  name: ecsi-mini

  loss:
    diffusion_loss:
      smooth_lddt_loss:
        chunk_size: 8
