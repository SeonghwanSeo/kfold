global_hparam:
  channel_s: 384 # token single channel
  channel_z: 128 # token pair channel
  channel_atom: 128 # atom single channel
  channel_atompair: 16 # atom pair channel
  use_kernel: true # for debugging purpose

train:
  # training hparams
  _yaml_: "train/af3-structure.yaml"

  seed: 42

  # pytorch lightning trainer hparams
  trainer:
    accelerator: 'auto'
    strategy: 'auto'
    devices: 'auto'
    num_nodes: 1
    precision: bf16-mixed
    max_epochs: 100
    limit_train_batches: 10_000
    log_every_n_steps: 1 # log per each accumulate_grad_batches
    enable_checkpointing: true
    accumulate_grad_batches: 32 # set according to number of GPUs

  wandb:
    use: true
    project: "KFold"
    name: null # set your run name
    group: null # set your group name
    entity: null # set your entity name

  data:
    train_batch_size: 1
    num_workers: 4
    max_tokens: 384
    boltz_processed_path: /cache/wykim_lab/rcsb_processed_targets/
    boltz_split_path: ./assets/splits/boltz1

model:
  input_embedder:
    _yaml_: "module/input_embedder/af3.yaml"
    channel_s: ${global_hparam.channel_s}
    channel_z: ${global_hparam.channel_z}

  trunk:
    _yaml_: "module/trunk/af3.yaml"
    channel_s: ${global_hparam.channel_s}
    channel_z: ${global_hparam.channel_z}
    use_kernels: ${global_hparam.use_kernel}

  structure_module:
    _yaml_: "module/structure_module/af3.yaml"

  score_model:
    _yaml_: "module/score_model/af3.yaml"
    channel_s: ${global_hparam.channel_s}
    channel_z: ${global_hparam.channel_z}
    channel_atom: ${global_hparam.channel_atom}
    channel_atompair: ${global_hparam.channel_atompair}

  distogram_head:
    _yaml_: "module/distogram_head/af3.yaml"
    channel_z: ${global_hparam.channel_z}
