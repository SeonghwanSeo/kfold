_yaml_: "full.yaml"

seed: 1

global_hparams:
  diffusion_batch_size: 48

data:
  max_chains: 20
  max_tokens: 384
  max_sequence_tokens: 512

  ccd_path: /cache/wykim_lab/kfold_data/v260522/ccd-train.pkl
  train_datasets:
    - _yaml_: "../dataset/rcsb-train.yaml"
      name: rcsb
      weight: 0.50
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/rcsb-train/

    # === Disordered PDB datasets ===
    - _yaml_: "../dataset/disordered_pdb.yaml"
      name: disordered_pdb
      weight: 0.02
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/disordered_pdb/

    # === Protein Monomer datasets ===
    - _yaml_: "../dataset/distill-monomer.yaml"
      name: AF2-MGnify-long
      weight: 0.399
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/AF2-MGnify-long/
    - _yaml_: "../dataset/distill-monomer.yaml"
      name: AF2-MGnify-short
      weight: 0.001
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/AF2-MGnify-short/
    - _yaml_: "../dataset/distill-monomer.yaml"
      name: afdb-long
      weight: 0.046
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/AFDB-long/
    - _yaml_: "../dataset/distill-monomer.yaml"
      name: AFDB-short
      weight: 0.004
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/AFDB-short/

    # === RNA Monomer datasets ===
    - _yaml_: "../dataset/distill-rna-monomer.yaml"
      name: Rfam
      weight: 0.05
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/Rfam/

    # === Complex datasets (AF-Multimer) ===
    - _yaml_: "../dataset/distill-homodimer.yaml"
      name: AFDB-homodimer
      weight: 0.05
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/AFDB-homodimer/

    # === Complex datasets (Multi-modal co-folding) ===
    - _yaml_: "../dataset/distill-complex.yaml"
      name: JASPAR
      weight: 0.02
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/JASPAR/

  val_datasets:
    - _yaml_: "../dataset/rcsb-val.yaml"
      name: rcsb-val
      data_path: /cache/wykim_lab/kfold_data/v260522/dataset/rcsb-val/
