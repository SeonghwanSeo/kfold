# Configuration for K-Fold structure module training

# Training Configuration
name: structure-only
out_dir: ./experiments/

# Random Seed
seed: 42

data:
  _registry_: "datamodule"
  _class_: TrainingDataModule

  # Data paths
  lmdb_path: <LMDB_PATH_PLACEHOLDER>
  manifest_path: <MANIFEST_PATH_PLACEHOLDER>
  split_path: ./assets/splits/boltz1

  # DataLoader
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 4
  max_tokens: 384
  pin_memory: true
  safe_load: true

  filters:
    - _registry_: "data_filter"
      _class_: NumChainFilter
      max_chains: 300
    - _registry_: "data_filter"
      _class_: ReleaseDateFilter
      date: "2021-09-30"
      ref: released
    - _registry_: "data_filter"
      _class_: ResolutionFilter
      resolution: 9.0

  cropper:
    _registry_: "data_cropper"
    _class_: BoltzCropper
    min_neighborhood: 0
    max_neighborhood : 40

  sampler:
    _registry_: "data_sampler"
    _class_: ClusterSampler
    beta_chain: 0.5
    beta_interface: 1.0
    allow_redundant: True

# Lightning Trainer Configuration
trainer:
  accelerator: 'auto'
  strategy: 'auto'
  devices: 'auto'
  num_nodes: 'auto'
  precision: bf16-mixed
  max_epochs: -1
  limit_train_batches: 100_000
  log_every_n_steps: 1
  enable_checkpointing: true
  accumulate_grad_batches: 256 # 256 // batch_size // num_gpus
  gradient_clip_val: 10.0

wandb:
  use: false
  project: "KFold"
  group: null # set your group name
  entity: null # set your entity name

# Exponential Moving Average (EMA)
training:
  # Training step hyperparameters
  train_trunk: true
  train_distogram_head: true
  train_structure_module: true
  train_confidence_head: false

  num_cycles: 4

  # For structure module training
  diffusion_batch_size: 48

  # For confidence module training
  num_steps: 20  # Mini-diffusion rollout
  num_diffusion_samples: 1  # Number of diffusion samples for confidence training

validation:
  # Validation step hyperparameters
  num_cycles: 4
  num_steps: 20
  num_diffusion_samples: 5
  symmetry_correction: false # TODO: fix get_true_coordinates function to use symmetry correction

optimizer:
  opt: 'adam'
  beta_1: 0.9
  beta_2: 0.95
  eps: 1e-8
  lr_scheduler: af3
  base_lr: 0.0
  max_lr: 0.0018
  lr_warmup_no_steps: 1000
  lr_start_decay_after_n_steps: 50000
  lr_decay_every_n_steps: 50000
  lr_decay_factor: 0.95
  use_ema: true
  ema_decay: 0.999

loss:
  weights:
    # global loss weights
    distogram: 3e-2
    diffusion: 4.0
    confidence: 1e-4
    # diffusion loss weights
    smooth_lddt: 1. # 0 for fine-tuning (See Section 5.2 for the AF3 paper)
    bond: 0.0 # 1 for fine-tuning (See Section 5.2 for the AF3 paper)
    # confidence loss weights
    pae: 0.0 # 1 for final stage training

  # Distogram loss
  distogram_loss:
    num_bins: 64
    min_dist: 2.0
    max_dist: 22.0

  # Diffusion loss
  diffusion_loss:
    # Weighted MSE Loss
    mse_loss:
      weight_protein: 1.0
      weight_dna: 5.0
      weight_rna: 5.0
      weight_ligand: 10.0
      scale: false

    # Bond Loss
    bond_loss: {}

    # Smooth LDDT Loss
    smooth_lddt_loss:
      cutoff: 15.0
      cutoff_nucleic_acid: 30.0

  # Confidence loss
  # TODO
  confidence_loss: {}
