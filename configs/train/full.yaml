# Configuration for K-Fold training
name: full-train
out_dir: ./experiments/

# Reproducibility
seed: 1 # NOTE: You may have to set different seeds for different stages

# Training parameters for multi-gpu setup.
global_hparams:
  batch_size: 1
  diffusion_batch_size: 48
  global_batch_size: 256
  num_global_steps_per_epoch: 1000

# Compilation settings
compile:
  enabled: false
  mode: "default"
  dynamic: false

data:
  _registry_: "datamodule"
  _class_: TrainingDataModule

  # Training hyperparameters
  max_chains: ???
  max_tokens: ???
  max_sequence_tokens: ???

  # DataLoader
  train_batch_size: 1 # NOTE: Overridden by global_hparam
  num_workers: 8
  persistent_workers: true
  pin_memory: false
  safe_load: true

  # CCD path
  ccd_path: <CCD_PATH_PLACEHOLDER>

  # Datasets
  data_root: <DATA_ROOT_PLACEHOLDER>
  train_datasets: []
  val_datasets: []

  # Prior sampler for diffusion bridge modeling
  prior_sampler:
    # If null, no prior sampling
    chain_translation_scale: 24.0 # Angstroms
    use_ot_permutation: true # Only for training.
    ligand_augmentation_scale: 0.3
    train: true # Only for train/val

# Lightning Trainer Configuration
trainer:
  accelerator: "auto"
  strategy: "auto"
  devices: "auto"
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: -1
  limit_train_batches: 1 # NOTE: Overridden by global_hparam
  limit_val_batches: null
  log_every_n_steps: 10
  enable_checkpointing: true
  accumulate_grad_batches: 1 # NOTE: Overridden by global_hparam
  gradient_clip_val: 10.0

# Exponential Moving Average (EMA)
training:
  # Training step hyperparameters
  train_trunk: true
  train_distogram_head: true
  train_structure_module: true
  train_confidence_head: true

  num_recycles: 3

  # For structure module training
  diffusion_batch_size: 48 # NOTE: Overridden by global_hparam

  # For confidence module training
  num_mini_rollout_steps: 20 # Number of rollout steps for confidence training
  num_mini_rollout_samples: 1 # Number of diffusion samples for confidence training

  # Train loss binned logging
  log_time_binned_losses: false
  time_bin_width: 0.1
  log_entity_binned_losses: false

validation:
  # Validation step hyperparameters
  num_recycles: 3
  num_steps: 200
  num_diffusion_samples: 5
  save_predictions: false
  return_traj: false
  traj_format: "pdb"

optimizer:
  opt: "adam"
  beta_1: 0.9
  beta_2: 0.95
  eps: 1e-8
  lr_scheduler: af3
  base_lr: 0.0
  max_lr: 0.0018
  lr_warmup_no_steps: 1000
  lr_start_decay_after_n_steps: 50000
  lr_decay_every_n_steps: 50000
  lr_decay_factor: 0.95
  ema_decay: 0.999
  validate_with_ema_after_n_steps: 5000
  load_opt_state_from_checkpoint: true
  final_training_stage: false

loss:
  weights:
    # Global loss weights
    distogram: 3e-2
    diffusion: 4.0
    confidence: 1e-4
    # Diffusion loss weights
    chain_com: 0.0
    bond: 0.0 # 1 for fine-tuning (See Section 5.2 for the AF3 paper)
    smooth_lddt: 1.0

  # Distogram loss
  distogram_loss:
    num_bins: 64
    min_dist: 2.0
    max_dist: 22.0

  # Diffusion loss
  diffusion_loss:
    # Weighted MSE Loss
    mse_loss:
      # NOTE: these are same to AlphaFold3:
      # w = 1 + 5 * is_dna + 5 * is_rna + 10 * is_ligand
      upweight_protein: 0.0
      upweight_dna: 5.0
      upweight_rna: 5.0
      upweight_ligand: 10.0
      align_true_to_pred: true

    # Bond Loss
    bond_loss: {}

    # Smooth LDDT Loss
    smooth_lddt_loss:
      repr_atom_only: false # If True, use [Nrepr, N] instead of [N, N] for LDDT calculation.
      chunk_size: 1 # Number of samples per chunk for LDDT calculation.
      use_kernel: true # Use triton kernel for LDDT calculation.

  # Confidence loss
  confidence_loss:
    plddt_loss:
      num_bins: 50
    pae_loss:
      min_dist: 0.0
      max_dist: 32.0
      num_bins: 64
    pde_loss:
      min_dist: 0.0
      max_dist: 32.0
      num_bins: 64
    experimentally_resolved_loss: {}

wandb:
  use: false
  project: "KFold" # Set your project name
  entity: "K-Fold" # Set your entity name
  group: null # Set your group name
  tags: [] # Ddd your tags
