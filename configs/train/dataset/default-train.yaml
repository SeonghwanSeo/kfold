# Default dataset configuration for training
_yaml_: "default.yaml"

name: ???
type: ???
prob_drop_apo: 0.1 # Probability of dropping apo structures during training
prob_drop_struct_token: 0.1 # Probability of dropping structure tokens during training
prob_use_complex_apo: 0.0
prob_use_complex_prior: 0.0
weight: 1.0 # sample weight for this dataset

# Random seed for data augmentation.
seed: null

sampler: ???

cropper:
  _registry_: "data_cropper"
  _class_: AlphaFold3Cropper
  w_contiguous: 0.1
  w_spatial: 0.1
  w_spatial_interface: 0.8

# Enable perturbation during training
prob_perturbation: 0.90
apo_perturb:
  prob_rieprody: 0.0 # Default: use metric-free BioPrior perturbation
  rieprody: null
  bioprior:
    max_steps: 10 # Maximum random walk steps
