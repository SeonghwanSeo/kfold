# === Model Configuration === #
# kernel settings
kernel_cuequivariance: true

# Module configurations
channel_s: 384
channel_z: 256
dropout: 0.25

input_embedder:
  _yaml_: "module/input_embedder.yaml"

apo_module:
  _yaml_: "module/apo_module.yaml"

protein_sequence_encoder:
  _yaml_: "module/protein_sequence_encoder.yaml"

protein_structure_encoder:
  _yaml_: "module/protein_structure_encoder.yaml"

rna_sequence_encoder:
  _yaml_: "module/rna_sequence_encoder.yaml"

trunk:
  num_lm_blocks: 4
  num_main_blocks: 48
  num_refine_blocks: 2
  dropout: 0.25
  blocks_per_ckpt: null

parcae:
  state_init: trunc_normal
  decay_init: 0.4472135954999579

score_model:
  _yaml_: "module/score_model.yaml"

diffusion_head:
  _yaml_: "module/edm.yaml"

distogram_head:
  _yaml_: "module/distogram_head.yaml"

confidence_head:
  _yaml_: "module/confidence_head.yaml"

patch_pair_geometry:
  enabled: false
  channel_z: 256
  num_bins: 64
  min_dist: 2.0
  max_dist: 22.0
  patch_size: 16
  max_patches_per_chain: 8
  max_patch_pairs: 256
  pool_chunk_size: 16
  pool_max_tokens_per_patch: 16
  interface_cutoff: 12.0
  positive_cutoff: 12.0
  hard_negative_cutoff: 18.0

# Training preconditioning
diffusion_conditioning_drop_rate: 0.2
confidence_conditioning_drop_rate: 0.2
