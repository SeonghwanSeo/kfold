# === Model Configuration === #
_registry_: "main_module"
_class_: KFold

# kernel settings
kernel_cuequivariance: true

# Module configurations
channel_s: 384
channel_z: 256
dropout: 0.25

input_embedder:
  _yaml_: "module/input_embedder.yaml"

protein_sequence_encoder:
  _yaml_: "module/protein_sequence_encoder.yaml"

protein_structure_encoder:
  _yaml_: "module/protein_structure_encoder.yaml"

rna_sequence_encoder:
  _yaml_: "module/rna_sequence_encoder.yaml"

trunk:
  num_lm_blocks: 4
  num_main_blocks: 48
  num_refine_blocks: 2
  dropout: 0.25
  blocks_per_ckpt: null

score_model:
  _yaml_: "module/score_model.yaml"
  channel_coords: 6

diffusion_head:
  _yaml_: "module/ecsi.yaml"

distogram_head:
  _yaml_: "module/distogram_head.yaml"

confidence_head:
  _yaml_: "module/confidence_head.yaml"

# Training preconditioning
diffusion_conditioning_drop_rate: 0.2
confidence_conditioning_drop_rate: 0.2
