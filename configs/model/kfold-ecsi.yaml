# === Model Configuration === #
_registry_: "main_module"
_class_: KFold

# kernel settings
kernel_cuequivariance: true

# Module configurations
input_embedder:
  _yaml_: "module/input_embedder/kfold.yaml"

sequence_encoder:
  _yaml_: "module/sequence_encoder/esm-multimodal.yaml"

structure_encoder:
  _yaml_: "module/structure_encoder/triprorep.yaml"

trunk:
  _yaml_: "module/trunk/kfold.yaml"

structure_module:
  _yaml_: "module/structure_module/ecsi.yaml"

score_model:
  _yaml_: "module/score_model/af3.yaml"
  channel_coords: 6

distogram_head:
  _yaml_: "module/prediction_head/distogram_head.yaml"

confidence_head:
  _yaml_: "module/prediction_head/confidence_head.yaml"

# Training preconditioning
diffusion_conditioning_drop_rate: 0.2
confidence_conditioning_drop_rate: 0.2
