_registry_: "input_embedder"
_class_: "KFoldInputEmbedder"
channel_s: 384
channel_z: 128
channel_atom: 128
channel_atompair: 16
atoms_per_window_queries: 32
atoms_per_window_keys: 128
atom_encoder_blocks: 3
atom_encoder_heads: 4
max_relative_token: 32
max_relative_chain: 2

# Apo-specific configs
use_apo: true
use_c_beta_for_apo: false
apo_distmap_type: 'rbf'
apo_min_dist: 2.0
apo_max_dist: 22.0
apo_num_bins: 64
apo_add_last_bin: false

# Pretrain embedding-specific configs
channel_seq_encoder: null

# Interaction-specific configs
use_interaction: false
num_interaction_types: 8
num_pair_interaction_types: 5
debug_interaction: false
debug_interaction_max_logs: 1
