_registry_: "structure_module"
_class_: "KFoldECSI"

gamma_max: 12
gamma_scale_com: 2.0
gamma_scale_internal: 2.0
time_power: 1.0

sigma_data: 16.0
sigma_data_end: 66.0
cov_xy: 128.0

sampling:
  steps: 200
  time_min: 0.001
  time_max: 0.999
  eta: 1.0
  eta_com: null
  eta_internal: null
  align_x0_hat_to_xt: true
  perturb_xt: true
  endpoint_perturb_scale: 0.1
  ode_start_time: 0.35
  use_pinned_churn: true
  churn_factor: 2.5
  churn_end_time: 0.7
  schedule:
    global_u_power: 2.0
    churn_fraction: 0.5
    churn_power: 1.7
    middle_power: 1.0
    ode_fraction: 0.20
    ode_power: 2.6

train_time_sampling:
  logit_normal: false
  alpha: 1.0
  beta: 1.0
  uniform_mix_prob: 0.0

coordinate_augmentation: True
normalize_data_end: True
use_prior_coords: true
train_align_prior_to_label: false
s_trans: 0.0
