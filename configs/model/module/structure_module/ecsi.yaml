_registry_: "structure_module"
_class_: "KFoldECSI"

# Sampling configuration
num_steps: 200
sigma_min: 0.001  # t_min
sigma_max: 0.999  # t_max (near 1)

# Linear route parameters (Table 8)
gamma_max: 24  # \gamma_t = 0.5 * \gamma_\max * \sqrt{t^k(1-t^k)}
time_power: 2.0
route_type: "linear"
# DDBM-VP route parameters (Appendix C.2)
ddbm_vp_beta_min: 0.1
ddbm_vp_beta_d: 2.0

# Data distribution parameters
sigma_data: 16.0  # holo structures (\sigma_0)
sigma_data_end: 16.0  # apo structures (\sigma_T)
cov_xy: 128.0  # \sigma_data * \sigma_data_end / 2

# Sampling schedule
rho: 0.7 # used only for Karras schedule
sampling_schedule_type: "phase_power"

# 1. global reparameterization: build the schedule in u-space, then map with t = u^(1/p)
sampling_schedule_global_u_power: 2.0

# 2. churn-region schedule: allocate a dedicated early SDE/churn window
sampling_schedule_churn_fraction: 0.35
sampling_schedule_churn_power: 1.2

# middle SDE region between churn cutoff and ODE cutoff
sampling_schedule_middle_power: 1.0

# 3. ODE-region schedule: allocate a dedicated late ODE window with a zero-slope tail
sampling_schedule_ode_fraction: 0.25
sampling_schedule_ode_power: 2.6

# legacy piecewise-power knobs kept for backwards-compatible overrides
sampling_schedule_piecewise_power: 3.0
sampling_schedule_start_power: 2.0
sampling_schedule_end_power: 3.0
sampling_schedule_midpoint: 0.4
sampling_schedule_endpoint_trim: 0.02

# Training noise level sampling (not used - uniform sampling used instead)
P_mean: -1.2
P_std: 1.5

# Stochasticity control
# eta=0: deterministic ODE, eta=1: full SDE (DDBM-style)
eta: 1.0

# Switch to deterministic update for small t (ODE-like) during sampling.
# If set <= 0, this deterministic phase is disabled.
ode_time_duration: 0.4
perturb_xt: true
endpoint_perturb_scale: 0.1
use_forward_pinned_churn: true
churn_factor: 2.5
churn_until_time: 0.7

# Other settings
coordinate_augmentation: True
normalize_data_end: True
use_prior_coords: true

logit_normal_sampling: False
sampling_alpha: 1.0
sampling_beta: 1.0

alignment_entity_strategy: null
alignment_level: "chain"
s_trans: 0.0

# ECSI-specific inference settings
inference_align_x0_hat_to_x_t: true
