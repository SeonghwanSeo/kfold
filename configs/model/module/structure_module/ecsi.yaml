_registry_: "structure_module"
_class_: "KFoldECSI"

version: 0

gamma_max: 24
time_power: 1.0

sigma_data: 16.0
sigma_data_end: 66.0
cov_xy: 128.0

sampling:
  time_min: 0.0001
  time_max: 0.9999
  eta: 1.0
  align_x_0_hat_to_x_t: true
  perturb_x_t: true
  endpoint_perturb_scale: 0.1
  churn_factor: 2.5
  churn_end_time: 0.7
  ode_start_time: 0.35
  schedule:
    global_u_power: 1.0
    ode_fraction: 0.20
    sde_power: 2.0
    ode_power: 1.3

train_time_sampling:
  schedule: "uniform"
  logit_normal_param: [-1.0, 1.8]
  beta_param: [0.5, 0.5]
