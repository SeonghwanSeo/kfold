_registry_: "structure_module"
_class_: "KFoldECSI_Decoupling"

# ECSI preconditioning
sigma_data: 16.0
sigma_data_end: 48.0
cov_xy: 300.0

# ECSI coefficients
time_min: 1e-8
time_max: 0.9999
gamma_max: 24.0
time_power: 1.0
eta: 1.0
gamma_scale_intra: 1.0
gamma_scale_com_radial: 0.5
gamma_scale_com_tentacle: 0.1

# Inference time schedule
align_x_0_hat_to_x_t: true
churn_factor: 0.1
churn_end_time: 0.5
churn_step_fraction: 0.4
churn_step_power: 1.0
ode_step_power: 4.0

# Training time schedule
train_time_schedule_params: [-0.8, 1.8, 2.0]
