# === Model Configuration for ECSI-EDM w/ Pairmixer === #
# Uses EDM formulation (Gaussian prior) instead of ECSI (apo prior)
_registry_: "main_module"
_class_: KFold

input_embedder:
  _yaml_: "module/input_embedder/pretrained.yaml"
  channel_seq_encoder: null # Should be overriden
  channel_struct_encoder: null # Should be overriden
  use_apo: true

trunk:
  _yaml_: "module/trunk/pairmixer.yaml"
  use_cuequiv_kernels: true

structure_module:
  _yaml_: "module/structure_module/ecsi_edm.yaml"

score_model:
  _yaml_: "module/score_model/apo_conditioned.yaml"
  channel_coords: 3  # No prior concatenation (ECSI uses 6)
  use_prior_coords: false
  use_apo: false

distogram_head:
  _yaml_: "module/distogram_head/af3.yaml"
