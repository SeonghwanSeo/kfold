model:
  _yaml_: "model/boltz1-trunk-ddbm.yaml"
  trunk:
    use_cuequiv_kernels: true
    use_msa: false # Include MSAModule or not
  structure_module:
    synchronize_sigmas: true
  load_weight: false
  freeze_weight: false

train:
  _yaml_: "train/structure_only.yaml"

  name: boltz1
  out_dir: ./experiments/
  seed: 42
  synchronize_seed: false # Set false with synchronized_sigmas=true

  # pytorch lightning trainer hparams
  trainer:
    strategy: "auto"
    devices: 8
    num_nodes: 1
    precision: 32
    max_epochs: 100
    limit_train_batches: 3000 # 3 hours
    accumulate_grad_batches: 16

  training:
    diffusion_batch_size: 16

  data:
    train_batch_size: 1
    max_tokens: 512
    lmdb_path: /cache/wykim_lab/kfold_data/kfold_rcsb_processed_v251120.lmdb/
    manifest_path: /cache/wykim_lab/kfold_data/manifests/af3_manifest.pkl
    symmetry_path: /cache/wykim_lab/kfold_data/symmetry.pkl
    split_path: ./assets/splits/boltz1
    num_workers: 4

    featurization_args:
      synchronize_ref_pos_augmentation: true

  loss:
    diffusion_loss:
      mse_loss:
        scale: true

  wandb:
    use: false
    project: "Boltz1-compare"
    group: boltz-kfold
    entity: K-Fold
