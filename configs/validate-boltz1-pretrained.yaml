model:
  _yaml_: "model/boltz1.yaml"
  trunk:
    use_cuequiv_kernels: false # true can return slightly different results.
  load_weight: true
  freeze_weight: true

train:
  _yaml_: "train/structure_only.yaml"

  name: boltz1
  out_dir: ./experiments/
  seed: 42

  # pytorch lightning trainer hparams
  trainer:
    strategy: "auto"
    devices: "auto"
    num_nodes: 1
    precision: 32
    max_epochs: 100
    limit_train_batches: 3000
    accumulate_grad_batches: 16

  data:
    train_batch_size: 1
    max_tokens: 512
    lmdb_path: /cache/wykim_lab/kfold_data1/kfold_rcsb_processed_v251120.lmdb/
    manifest_path: /cache/wykim_lab/kfold_data1/manifests/af3_manifest.pkl
    split_path: ./assets/splits/boltz1
    num_workers: 4

    featurization_args:
      synchronize_ref_pos_augmentation: true
